<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="./dist/output.css" rel="stylesheet">
</head> 
<style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5rem;
    }
  </style>

<body  class="bg-slate-50 text-slate-800">
  <header class="sticky top-0 z-50 w-full bg-white/90 shadow-sm backdrop-blur">
    <nav aria-label="Navigasi utama"
      class="flex w-full flex-wrap items-center justify-between gap-4 px-6 py-5 sm:px-10 lg:px-16">
      <a href="#home" class="flex items-center gap-3 text-3xl font-bold text-[#211C84]">
        <span>Peminjaman Alat Praktik</span>
      </a>

      <ul class="flex flex-wrap gap-5 font-bold text-xl">
        <li><a class="hover:text-[#4D55CC]" href="#alat">Alat</a></li>
        <li><a class="hover:text-[#4D55CC]" href="#kategori">Kategori</a></li>
        <li><a class="hover:text-[#4D55CC]" href="#peminjaman">Peminjaman</a></li>
      </ul>
    </nav>
  </header>

  <main class="flex flex-col gap-16 py-8 px-8">

    <section id="alat">
        <h2 class="text-3xl font-bold text-[#211C84] md:text-4xl text-center mt-5">
          Tambah dan Edit Alat
        </h2>

        <div class="mt-8 flex flex-col lg:flex-row gap-8 items-start">
            
            <div class="w-full lg:w-80 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">

                <!-- Header Card Tombol Tab & Judul -->
                <div class="border-b border-slate-200 pb-4 mb-4">
                    <div class="flex gap-2 mb-3">
                        <button type="button" id="btn-tab-tambah-alat" class="flex-1 py-1.5 px-3 border-2 rounded-lg bg-blue-800 text-white font-semibold">➕ Tambah</button>
                        <button type="button" id="btn-tab-edit-alat" class="flex-1 py-1.5 px-3 border-2 rounded-lg hover:bg-blue-800 hover:text-white font-semibold">✏️ Edit</button>
                    </div>
                    <h3 id="judul-form-alat" class="text-xl font-bold text-center text-slate-800">Tambah Alat</h3>
                </div>

                <!-- form input sebelah kiri -->
                <form id="form-alat" class="flex flex-col gap-3">

                    <input type="hidden" id="edit-id-alat">

                   <div>
                    <label for="alat-id-kategori">ID Kategori:</label><br>
                    <input type="number" name="id-kategori" id="alat-id-kategori" class="border-2 rounded-md">
                   </div>

                   <div>
                    <label for="alat-nama">Nama Alat:</label><br>
                    <input type="text" name="nama-alat" id="alat-nama" class="border-2 rounded-md">
                   </div>
                   
                   <div>
                    <label for="alat-kondisi">Kondisi:</label><br>
                    <input type="text" name="kondisi" id="alat-kondisi" class="border-2 rounded-md">
                   </div>

                   <div>
                    <label for="alat-stok">Stok:</label><br>
                    <input type="number" name="stok" id="alat-stok" class="border-2 rounded-md">
                   </div>

                   <div>
                    <label for="name-lokasi">Lokasi:</label><br>
                    <input type="text" name="lokasi" id="name-lokasi" class="border-2 rounded-md">
                   </div><br>

                   <button type="submit" id="btn-sumbit-alat" class="border-2 hover:bg-blue-800 hover:text-white rounded-md">Tambah</button>
                </form>

            </div>

            <!-- tabel bagian kanan (Wadah selanjutnya) -->
            <div class="flex-1 w-full bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            
            </div>
        </div>
    </section><hr>

    <section id="kategori">
        <h2 class="text-3xl font-bold text-[#211C84] md:text-4xl text-center mt-5">
          Tambah dan Edit Kategori Alat
        </h2>

        <div class="mt-8 flex flex-col lg:flex-row gap-8 items-start">
            
            <!-- form bagian kiri (Card Utama) -->
            <div class="w-full lg:w-80 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">

                <!-- Header Card: Tombol Tab & Judul -->
                <div class="border-b border-slate-200 pb-4 mb-4">
                    <div class="flex gap-2 mb-3">
                        <button type="button" id="btn-tab-tambah-kategori" class="flex-1 py-1.5 px-3 border-2 rounded-lg bg-blue-800 text-white font-semibold">➕ Tambah</button>
                        <button type="button" id="btn-tab-edit-kategori" class="flex-1 py-1.5 px-3 border-2 rounded-lg hover:bg-blue-800 hover:text-white font-semibold">✏️ Edit</button>
                    </div>
                    <h3 id="judul-form-kategori" class="text-xl font-bold text-center text-slate-800">Tambah Kategori Alat</h3>
                </div>

                <!-- Form Input berada DI DALAM card kiri -->
                <form id="form-kategori" class="flex flex-col gap-3">

                    <input type="hidden" id="edit-id-kategori">

                   <div>
                    <label for="kategori-nama">Nama Kategori:</label><br>
                    <input type="text" name="nama-kategori" id="kategori-alat" class="border-2 rounded-md">
                   </div>

                   <div>
                    <label for="kategori-deskripsi">Deskripsi:</label><br>
                    <textarea id="kategori-deskripsi" name="deskripsi" rows="4" cols="30" class="border-2 rounded-md" placeholder="Tulis pesan panjang di sini..."></textarea>
                   </div><br>
                
                   <button type="submit" id="btn-sumbit-kategori" class="border-2 hover:bg-blue-800 hover:text-white rounded-md">Tambah</button>
                </form>

            </div>

            <!-- tabel bagian kanan (Wadah selanjutnya) -->
            <div class="flex-1 w-full bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        
            </div>
        </div>
    </section>


    <section id="peminjaman">
        <h2 class="text-3xl font-bold text-[#211C84] md:text-4xl text-center mt-5">
          Tambah dan Edit Peminjaman Alat
        </h2>

        <!-- wadah utama section alat (flex agar form kiri & tabel kanan sejajar) -->
        <div class="mt-8 flex flex-col lg:flex-row gap-8 items-start">
            
            <!-- form bagian kiri (Card Utama) -->
            <div class="w-full lg:w-80 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">

                <!-- Header Card: Tombol Tab & Judul -->
                <div class="border-b border-slate-200 pb-4 mb-4">
                    <div class="flex gap-2 mb-3">
                        <button type="button" id="btn-tab-tambah-peminjaman" class="flex-1 py-1.5 px-3 border-2 rounded-lg bg-blue-800 text-white font-semibold">➕ Tambah</button>
                        <button type="button" id="btn-tab-edit-peminjaman" class="flex-1 py-1.5 px-3 border-2 rounded-lg hover:bg-blue-800 hover:text-white font-semibold">✏️ Edit</button>
                    </div>
                    <h3 id="judul-form-peminjaman" class="text-xl font-bold text-center text-slate-800">Tambah Peminjaman Alat</h3>
                </div>

                <!-- Form Input berada DI DALAM card kiri -->
                <form id="form-alat" class="flex flex-col gap-3">
                    <input type="hidden" id="edit-id-peminjaman">

                   <div>
                    <label for="peminjaman-id-alat">Id Kategori:</label><br>
                    <input type="number" name="id-alat-peminjaman" id="peminjaman-id-alat" class="border-2 rounded-md">
                   </div>

                   <div>
                    <label for="peminjaman-nama-peminjam">Nama Peminjam:</label><br>
                    <input type="text" id="peminjaman-nama-peminjam" name="nama-peminjam-peminjaman" class="border-2 rounded-md">
                   </div>
                
                   <div>
                    <label for="peminjaman-kelas">Kelas:</label><br>
                    <input type="text" id="peminjaman-kelas" name="kelas-peminjaman" class="border-2 rounded-md">
                   </div>

                   <div>
                    <label for="peminjaman-tanggal-pinjam">Tanggal Pinjam:</label><br>
                    <input type="text" id="peminjaman-tanggal-pinjam" name="kelas-peminjaman" class="border-2 rounded-md">
                   </div>
                                
                   <div>
                    <label for="peminjaman-tanggal-kembali">Tanggal Kembali:</label><br>
                    <input type="text" id="peminjaman-tanggal-kembali" name="tanggal-kembali-peminjaman" class="border-2 rounded-md">
                   </div>
                                
                   <div>
                    <label for="peminjaman-jumlah">Jumlah:</label><br>
                    <input type="text" id="peminjaman-jumlah" name="jumlah-peminjaman" class="border-2 rounded-md">
                   </div>
                                
                   <div>
                    <label for="peminjaman-status">Status:</label><br>
                    <input type="text" id="peminjaman-status" name="status-peminjaman" class="border-2 rounded-md">
                   </div><br>
                
                   <button type="submit" id="btn-sumbit-peminjaman" class="border-2 hover:bg-blue-800 hover:text-white rounded-md">Tambah</button>
                </form>

            </div>

            <!-- tabel bagian kanan (Wadah selanjutnya) -->
            <div class="flex-1 w-full bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
        
            </div>
        </div>
    </section>
  </main>
  <script src="./js/app.js"></script>
</body>
</html>
